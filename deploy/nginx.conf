# Include inside the server block that serves site/ as root.
# Hashed build outputs never change, so cache them for a year.
location ~* \.[0-9a-f]{10}\.(js|wasm)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    types { application/wasm wasm; application/javascript js; }
}
# Odin runtime glue is not hashed: cache for a day.
location = /toy/odin.js { add_header Cache-Control "public, max-age=86400"; }
# Entry points must revalidate so a new build shows on the next visit.
location = /assets.json  { add_header Cache-Control "no-cache"; }
location = /index.html   { add_header Cache-Control "no-cache"; }
location = /             { add_header Cache-Control "no-cache"; }
gzip on; gzip_types application/wasm application/javascript text/html text/css application/json;
