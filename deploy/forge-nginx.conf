# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/thoughtassault.dev/before/*;

server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name thoughtassault.dev;
    server_tokens off;
    root /home/forge/thoughtassault.dev/site;

    # FORGE SSL (DO NOT REMOVE!)
    ssl_certificate /etc/nginx/ssl/thoughtassault.dev/3720995/server.crt;
    ssl_certificate_key /etc/nginx/ssl/thoughtassault.dev/3720995/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.html;
    charset utf-8;

    # FORGE CONFIG (DO NOT REMOVE!)
    include forge-conf/thoughtassault.dev/server/*;

    # nginx's default mime.types already maps .wasm to application/wasm.
    gzip on;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build outputs never change: 1 year, immutable.
    location ~* "\.[0-9a-f]{10}\.(js|wasm)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }
    location ~* ^/(toy|mania)/odin\.js$ {
        add_header Cache-Control "public, max-age=86400";
    }
    location ~* \.(png|jpg|webp|mp4|webm|svg|woff2)$ {
        add_header Cache-Control "public, max-age=604800";
    }
    location = /assets.json { add_header Cache-Control "no-cache"; }

    # Coolwave web export: Expo hashes its bundles and assets; the HTML routes stay fresh.
    location /coolwave/_expo/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /coolwave/assets/ { add_header Cache-Control "public, max-age=2592000"; }
    location /coolwave/place/ { try_files $uri /coolwave/place/[id].html; }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri $uri/ $uri.html =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log off;
    error_log  /var/log/nginx/thoughtassault.dev-error.log error;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/thoughtassault.dev/after/*;
