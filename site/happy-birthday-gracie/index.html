<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1b26">
<link rel="icon" type="image/png" href="favicon.png?v=64023138f4">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2a63f76836">
<link rel="manifest" href="manifest.json?v=aae1c1f565">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gracie &amp; Dory's Adventures">
<title>gracie's birthday adventures with dory</title>
<link rel="preload" href="fonts/literata-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css?v=2134857fdb">
<link rel="stylesheet" href="style.css?v=9e70a5767d">
<link rel="stylesheet" href="print.css?v=1abe5f362a" media="print">
</head>
<body>

<main class="card" id="card">
  <div class="art" id="art">
    <img id="art-img" src="" alt="">
  </div>
  <div class="body">
    <div id="text"></div>
    <div class="poem" id="poem" hidden>
      <div class="player">
        <button class="player__btn" id="pl-toggle" type="button" aria-label="play"></button>
        <input class="player__seek" id="pl-seek" type="range" min="0" max="1000" value="0"
               step="1" aria-label="position">
      </div>
      <div class="poem__lines" id="poem-lines"></div>
      <audio id="pl-audio" preload="metadata"></audio>
    </div>
    <div class="tail" id="tail" hidden></div>
    <div class="choices" id="choices"></div>
  </div>
</main>

<div class="booklet" id="booklet" hidden>
  <div class="booklet__bar">
    <button type="button" id="bk-print">Save as PDF</button>
    <button type="button" id="bk-restart">Start over</button>
  </div>
  <div class="pages" id="pages"></div>
  <div class="sheets" id="sheets"></div>
</div>

<script src="letter.js?v=ab6a84201b"></script>
<script src="poem.js?v=a73d4364bf"></script>
<script src="pages.js?v=d428b6331e"></script>
<script src="story.js?v=bae4801c5c"></script>
<script src="engine.js?v=a1dab3b8bb"></script>
</body>
</html>
