<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1b26">
<title>shape test</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">

  <div class="art art--empty">160 &times; 144</div>

  <div class="body">
    <h1 class="title">NODE TEXT HERE</h1>
    <p class="note">Body text sits here. This paragraph exists only to show the
    measure, the line height, and how far the text can run before the choices
    push it into a scroll.</p>

    <div class="note">palette</div>
    <div class="swatches">
      <figure class="sw"><div class="chip chip--hair"></div>hair<br><code>#dd5639</code></figure>
      <figure class="sw"><div class="chip chip--eyes"></div>eyes<br><code>#20a5a6</code></figure>
      <figure class="sw"><div class="chip chip--legs"></div>legs<br><code>#036016</code></figure>
      <figure class="sw"><div class="chip chip--dory"></div>dory<br><code>#256eff</code></figure>
      <figure class="sw"><div class="chip chip--bg"></div>bg<br><code>#0f1b26</code></figure>
      <figure class="sw"><div class="chip chip--fg"></div>text<br><code>#f5e8d1</code></figure>
    </div>

    <p class="note">Font is system-ui as a placeholder.</p>
  </div>

  <div class="choices">
    <button class="choice" type="button">CHOICE ONE HERE</button>
    <button class="choice" type="button">CHOICE TWO HERE</button>
  </div>

</main>
</body>
</html>
