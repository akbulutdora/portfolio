<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1b26">
<link rel="icon" type="image/png" href="favicon.png?v=62e550b0e7">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=b6b54aca06">
<title>gracie's birthday adventures with dory</title>
<link rel="preload" href="fonts/literata-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css?v=2134857fdb">
<link rel="stylesheet" href="style.css?v=70e729fcb0">
<link rel="stylesheet" href="print.css?v=65bb38682c" media="print">
</head>
<body>

<main class="card" id="card">
  <div class="art" id="art">
    <img id="art-img" src="" alt="">
  </div>
  <div class="body">
    <div id="text"></div>
    <div class="poem" id="poem" hidden>
      <div class="player">
        <button class="player__btn" id="pl-toggle" type="button" aria-label="play"></button>
        <input class="player__seek" id="pl-seek" type="range" min="0" max="1000" value="0"
               step="1" aria-label="position">
      </div>
      <div class="poem__lines" id="poem-lines"></div>
      <audio id="pl-audio" preload="metadata"></audio>
    </div>
    <div class="tail" id="tail" hidden></div>
  </div>
  <div class="choices" id="choices"></div>
</main>

<div class="booklet" id="booklet" hidden>
  <div class="booklet__bar">
    <button type="button" id="bk-print">Save as PDF</button>
    <button type="button" id="bk-restart">Start over</button>
  </div>
  <div class="pages" id="pages"></div>
  <div class="sheets" id="sheets"></div>
</div>

<script src="letter.js?v=9d609a48f5"></script>
<script src="poem.js?v=1fdcc252f6"></script>
<script src="story.js?v=6138675188"></script>
<script src="engine.js?v=965fa9b68b"></script>
</body>
</html>
