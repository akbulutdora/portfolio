<main class="card" id="card">
  <div class="art" id="art">
    <img id="art-img" src="" alt="">
  </div>
  <div class="body">
    <div id="text"></div>
  </div>
  <div class="choices" id="choices"></div>
</main>

<div class="booklet" id="booklet" hidden>
  <div class="booklet__bar">
    <button type="button" id="bk-back">Back</button>
    <button type="button" id="bk-print">Save as PDF</button>
    <button type="button" id="bk-restart">Start over</button>
  </div>
  <div class="booklet__how">
    Print on A4, double sided, <b>flip on the short edge</b>, scale 100%.
    Fold each sheet in half, nest them in order, staple the fold. Nothing is cut.
    <label><input type="checkbox" id="bk-flip"> The backs came out upside down</label>
  </div>
  <div class="pages" id="pages"></div>
  <div class="sheets" id="sheets"></div>
</div>
